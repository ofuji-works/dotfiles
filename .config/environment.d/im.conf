# Input method: fcitx5 (migrated from ibus)
# GNOME Wayland's mutter does not implement zwp_input_method_v2, so fcitx5
# cannot hook into the compositor's text-input path. Each toolkit must talk to
# fcitx5 directly over DBus via its own IM module, hence GTK_IM_MODULE is
# required here (unlike KDE/wlroots where text-input-v3 alone is enough).
GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
SDL_IM_MODULE=fcitx
# GLFW has no fcitx backend; its "ibus" backend speaks the same DBus protocol.
GLFW_IM_MODULE=ibus
