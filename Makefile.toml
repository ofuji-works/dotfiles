[tasks.setup]
dependencies = [
  "brew-tap",
  "install-packages",
  "git-settings",
  "set-codecompanion",
  "set-skk-dict"
]

[tasks.brew-tap]
command = "brew"
args = ["tap", "hashicorp/tap", "homebrew/cask-fonts"]

[tasks.install-packages]
command = "brew"
args = [
  "install",
  "font-hack-nerd-font",
  "mise",
  "docker",
  "docker-compose",
  "hashicorp/tap/terraform",
  "tree-sitter-cli"
]

# codecompanion.nvim が Claude Code を ACP 経由で使うためのブリッジ
[tasks.set-codecompanion]
command = "npm"
args = [
  "install",
  "-g",
  "@agentclientprotocol/claude-agent-acp"
]

# skkeleton が変換に使う SKK 辞書 (L 辞書) を取得する
[tasks.set-skk-dict]
command = "./scripts/setting-skk.sh"

# OS の日本語入力を fcitx5 + SKK に切り替える (Ubuntu/GNOME 専用のため setup には含めない)
[tasks.set-fcitx5]
command = "./scripts/setting-fcitx5.sh"

[tasks.git-settings]
command = "./scripts/setting-git.sh"

[tasks.update-chrome]
command = "./scripts/update-chrome.sh"

[tasks.set-config]
dependencies = [
  "set-config-neovim",
  "set-config-ghostty",
  "set-config-mise",
  "set-haskell"
]

[tasks.set-config-neovim]
command = "ln"
args = [
  "-s",
  "~/dotfiles/.config/nvim",
  "~/.config/nvim"
]

[tasks.set-config-ghostty]
command = "ln"
args = [
  "-s",
  "~/dotfiles/.config/ghostty",
  "~/.config/ghostty"
]

[tasks.set-config-mise]
command = "ln"
args = [
  "-s",
  "~/dotfiles/.config/mise",
  "~/.config/mise"
]

[tasks.set-haskell]
command = "./scripts/setting-haskell.sh"
